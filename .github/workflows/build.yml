name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ixmxamar/onetrainer-ultimate
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Relocate Docker storage to /mnt (~70GB)
        run: |
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{ "data-root": "/mnt/docker" }' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep -i "docker root dir" || true
          df -h / /mnt || true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          provenance: false

      - name: Smoke test CI gate
        run: docker run --rm --entrypoint bash ${{ env.IMAGE }}:ci-${{ github.sha }} -c "python /opt/scripts/smoke_test.py"

      - name: Tag + push to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:$SHA
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:cu128-torch2.8.0
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:$SHA
          docker push ${{ env.IMAGE }}:cu128-torch2.8.0

      - name: Tag + push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/onetrainer-ultimate"
          # Convert to lowercase for Docker tag compatibility
          GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${GHCR_IMAGE}:latest
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${GHCR_IMAGE}:$SHA
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${GHCR_IMAGE}:cu128-torch2.8.0
          docker push ${GHCR_IMAGE}:latest
          docker push ${GHCR_IMAGE}:$SHA
          docker push ${GHCR_IMAGE}:cu128-torch2.8.0
